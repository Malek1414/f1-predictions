[project]
name = "f1pred"
version = "0.1.0"
description = "F1 race and championship predictions with Elo ratings and Monte Carlo simulation"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.12"
dependencies = [
    "pandas>=2.2",
    "pyarrow>=17",
    "numpy>=2.0",
    "huggingface_hub>=0.25",
    "typer>=0.12",
    "rich>=13",
    "matplotlib>=3.9",
    "requests>=2.32",
    "pyyaml>=6",
]

[project.scripts]
f1pred = "f1pred.cli:app"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["f1pred"]

[tool.ruff]
line-length = 100
target-version = "py312"
# Newer ruff formats fenced code in Markdown; the plan/spec docs are not code to lint.
extend-exclude = ["docs"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
